      for (var x = 0; x < map[y].length; x++) {

    el.style.setProperty('--pxi-b', b.join(',') || '0 0 transparent');

     MyWorldContent.restoreImportedPacks().catch(function () {}).then(function () {
    State.init();
    HabitData.init();
    Nav.init();
    Modal.init();
    
    Water.init();
    Habits.init();
    if (typeof GeneralAlarm !== 'undefined') GeneralAlarm.init();
        TimeEngine.init();
    Calendar.init();
        Journal.init();
    Library.init();
    Study.init();
    StudyWallpaper.init();
    Progress.init();
        Notepad.init();
    Gallery.init();
    Player.init();
    UnrecordedStudy.init();
    Gamification.init();
    BackupUI.init();
      Settings.init();
    Assistant.init();
    ForcedFullscreen.init();
    }).finally(_mountMiscAmbient);
    function _mountMiscAmbient() {
      if (typeof MiscSound !== 'undefined') MiscSound.bindGlobalUI();
      const ambientLayer = document.getElementById('misc-ambient-layer');
      if (typeof CustomCursor !== 'undefined') CustomCursor.init();
      
      
      if (ambientLayer) {
        if (typeof Firefly !== 'undefined') Firefly.mount(ambientLayer, { count: 6 });
        if (typeof Ladybug !== 'undefined') Ladybug.mount(ambientLayer);
        
      }
            const objectsLayer = document.getElementById('misc-objects-layer');
      let wishButterflyMounted = false;
      function mountWishButterfly() {
        if (wishButterflyMounted || !objectsLayer || typeof WishButterfly === 'undefined') return;
        if ((State.get().settings || {}).wishButterflyEnabled !== true) return;
        wishButterflyMounted = true;
        WishButterfly.mount(objectsLayer, { top: '16%', left: '86%' });
      }
      mountWishButterfly();
      window.addEventListener('lavender-wish-butterfly-setting', mountWishButterfly);
      const studyScreen = document.getElementById('screen-study');
      if (studyScreen && typeof CandleLamp !== 'undefined') {
        studyScreen.style.position = studyScreen.style.position || 'relative';
                CandleLamp.mount(studyScreen);
        if (typeof Study !== 'undefined' && Study.syncCandleSlot) Study.syncCandleSlot();
      }
      // Paper Pocket lives inside the sidebar (docked at its foot) so it shares the sidebar's layout, collapse and stacking context.
      const mainNav = document.getElementById('main-nav');
      if (mainNav && typeof PaperPocket !== 'undefined') {
        const pocket = PaperPocket.mount(mainNav);
        if (pocket && pocket.element) pocket.element.setAttribute('title', 'Paper Pocket');
      }
      const paintbrushBtn = document.getElementById('paintbrush-icon');
      if (paintbrushBtn && typeof MiscCosmetics !== 'undefined') MiscCosmetics.mountPaintbrushButton(paintbrushBtn);
    }

  // Sidebar presentation only: remembers the collapsed rail (desktop), runs the off-canvas drawer (mobile) and mirrors the active screen name in the top bar.
  (function () {
    var body = document.body;
    var btn = document.getElementById('nav-collapse-btn');
    var nav = document.getElementById('main-nav');
    var label = document.getElementById('nav-context-label');
    var KEY = 'lavender-nav-collapsed';
    var mq = window.matchMedia ? window.matchMedia('(max-width: 860px)') : null;
    function isMobile() { return !!(mq && mq.matches); }
    function syncBtn() {
      if (!btn) return;
      var expanded = isMobile() ? body.classList.contains('nav-open') : !body.classList.contains('nav-collapsed');
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      var t = isMobile() ? (expanded ? 'Close navigation' : 'Open navigation') : (expanded ? 'Collapse navigation' : 'Expand navigation');
      btn.setAttribute('aria-label', t);
      btn.setAttribute('title', t);
    }
    function setCollapsed(on) {
      body.classList.toggle('nav-collapsed', on);
      syncBtn();
    }
    function setOpen(on) {
      body.classList.toggle('nav-open', on);
      syncBtn();
    }
    try { setCollapsed(localStorage.getItem(KEY) === '1'); } catch (e) {}
    syncBtn();
    if (btn) btn.addEventListener('click', function () {
      if (isMobile()) { setOpen(!body.classList.contains('nav-open')); return; }
      var on = !body.classList.contains('nav-collapsed');
      setCollapsed(on);
      try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
    });
    // Mobile drawer: close after choosing a screen, on a scrim tap, or on Escape (unless a modal owns it).
    if (nav) nav.addEventListener('click', function (e) {
      if (isMobile() && e.target.closest('.nav-btn')) setOpen(false);
    });
    document.addEventListener('click', function (e) {
      if (isMobile() && e.target === body && body.classList.contains('nav-open')) setOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || !isMobile() || !body.classList.contains('nav-open')) return;
      var ov = document.getElementById('modal-overlay');
      if (ov && getComputedStyle(ov).display !== 'none') return;
      setOpen(false);
    });
    if (mq && mq.addEventListener) mq.addEventListener('change', function () {
      body.classList.remove('nav-open');
      syncBtn();
    });
    function syncLabel() {
      if (!nav || !label) return;
      var active = nav.querySelector('.nav-btn.active');
      label.textContent = active ? (active.getAttribute('data-tip') || active.textContent.trim()) : '';
    }
    if (nav && window.MutationObserver) {
      new MutationObserver(syncLabel).observe(nav, { attributes: true, subtree: true, attributeFilter: ['class'] });
    }
    syncLabel();
  })();

  if ('serviceWorker' in navigator) {
  window.LavenderSW = { registration: null, updateAvailable: false, pendingVersion: null };
  navigator.serviceWorker.addEventListener('message', function (e) {
    // Posted by a newly installed worker once it's fully cached and waiting.
    // Receiving it while a controller already exists is the real "update
    // available" moment — mark it ready and expose its version, never activate.
    if (e.data && e.data.type === 'SW_INSTALLED' && navigator.serviceWorker.controller) {
      window.LavenderSW.updateAvailable = true;
      window.LavenderSW.pendingVersion = e.data.version;
      window.dispatchEvent(new CustomEvent('lavender-update-ready'));
    }
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js')
      .then(function (reg) {
        window.LavenderSW.registration = reg;
      })
.catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
  });
}
  </script>
</body>
  </html>
