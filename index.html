<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="app-header">
  <div id="app-header-left">
    <span id="app-title">Lavender</span>
  </div>
  <div id="app-header-right">
    <div id="top-meter-bar">
      <div id="productivity-bar-wrap" title="Productivity">
        <div id="productivity-bar-fill"></div>
        <span id="productivity-bar-label"></span>
      </div>
      <div id="exp-bar-wrap" title="EXP">
        <div id="exp-bar-fill"></div>
        <span id="exp-bar-label"></span>
      </div>
    </div>
    <button id="utility-menu-btn" title="Utilities">&#9776;</button>
  </div>
</header>

<div id="utility-drawer" class="utility-drawer-hidden">
  <div class="utility-drawer-group" data-group="study">
    <button id="global-break-btn" title="Take a break">Break</button>
    <button id="unrecorded-study-icon" title="Unrecorded Study">&#128221;+</button>
    <button id="water-icon" title="Log water">&#128167;</button>
  </div>
  <div class="utility-drawer-divider"></div>
  <div class="utility-drawer-group" data-group="personal">
    <button id="notepad-icon" title="Notepad">&#128221;</button>
  </div>
  <div class="utility-drawer-divider"></div>
  <div class="utility-drawer-group" data-group="system">
    <button id="assistant-icon" title="Assistant">&#128203;</button>
    <button id="settings-icon" title="Settings">&#9881;</button>
    <button id="fullscreen-btn" title="Fullscreen">&#9974;</button>
  </div>
</div>

<button id="journal-lock-toggle" title="Journal lock" style="display:none">&#128275;</button>
<div id="global-break-takeover" style="display:none"></div>

<nav id="main-nav">
  <button class="nav-btn" data-screen="library">Library</button>
  <button class="nav-btn" data-screen="calendar">Calendar</button>
  <button class="nav-btn" data-screen="journal">Journal</button>
  <button class="nav-btn" data-screen="study">Study</button>
  <button class="nav-btn" data-screen="progress">Progress</button>
</nav>

  <main>
    <section id="screen-calendar" class="screen">
      <div id="calendar-header">
        <button id="calendar-prev">&lt; prev</button>
        <span id="calendar-month-label"></span>
        <button id="calendar-next">next &gt;</button>
      </div>
      <div id="calendar-grid"></div>
      <div id="calendar-countdown-row">
        <div id="calendar-countdown"></div>
        <button id="calendar-events-btn" title="All important dates &amp; events">Events</button>
      </div>
      <div id="calendar-streak"></div>
    </section>
    <section id="screen-journal" class="screen"></section>
    <section id="screen-library" class="screen">
      <div id="library-layout">
        <div id="library-left">
          <div id="library-main">
            <div id="library-body"></div>
          </div>
          <div id="planner-side">
            <div id="planner-main">
              <h3>New Task</h3>
              <div id="planner-form"></div>
            </div>
          </div>
        </div>
        <div id="library-right-panel">
          <div id="library-right-header">
            <button id="library-panel-prev">&#8592;</button>
            <span id="library-panel-tab-label">Today</span>
            <button id="library-delete-all-archived" style="display:none;" title="Delete all archived items">Delete All</button>
            <button id="library-panel-next">&#8594;</button>
            <button id="library-panel-collapse" title="Collapse panel">&#10006;</button>
          </div>
          <div id="library-panel-content"></div>
        </div>
        <button id="library-panel-expand" style="display:none;" title="Show panel">&#8942;</button>
      </div>
    </section>
    <section id="screen-study" class="screen">
      <div id="study-layout">
        <div id="study-header">
          <h3>Study</h3>
          <button id="study-alarm-icon" title="Today's alarms" aria-label="Today's alarms">&#9200;</button>
        </div>
        <div id="study-clock-panel"></div>
        <div id="study-session-panel"></div>
        <div id="study-cutoff-view" style="display:none"></div>
        <div id="study-log-panel" style="position:fixed; bottom:10px; left:10px; max-width:260px; max-height:220px; overflow-y:auto; background:#fff; border:1px solid #ccc; border-radius:6px; padding:8px 10px; font-size:12px; z-index:999; box-shadow:0 1px 4px rgba(0,0,0,0.15);"></div>
      </div>
    </section>
    <section id="screen-progress" class="screen"></section>
</main>

  <div id="modal-overlay">
    <div id="modal-content" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Load order matters: storage -> state -> nav -->
<script src="storage.js"></script>
<script src="state.js"></script>
  <script src="notify.js"></script>
  <script src="sleep-data.js"></script>
  <script src="water-data.js"></script>
  <script src="alarm-data.js"></script>
  <script src="nav.js"></script>
  <script src="datehub.js"></script>
  <script src="streak.js"></script>
  <script src="planner-data.js"></script>
  <script src="targets-data.js"></script>
  <script src="timeengine.js"></script>
  <script src="journal-data.js"></script>
  <script src="modal.js"></script>
  <script src="targets.js"></script>
  <script src="sleep.js"></script>
  <script src="water.js"></script>
  <script src="alarm.js"></script>
  <script src="journal.js"></script>
  <script src="calendar.js"></script>
  <script src="planner.js"></script>
  <script src="library.js"></script>
  <script src="study.js"></script>
  <script src="gamification-data.js"></script>
  <script src="productivity-data.js"></script>

  <script src="progress-data.js"></script>
  <script src="progress.js"></script>
  <script src="assistant-data.js"></script>
  <script src="assistant.js"></script>
  <script src="notepad.js"></script>
  <script src="unrecorded.js"></script>
  <script src="gamification.js"></script>
  
  <script src="backup.js"></script>
  <script src="settings.js"></script>
  <script>
    State.init();
    Nav.init();
    Modal.init();
    
    Water.init();
    Alarm.init();
    TimeEngine.init();
    Calendar.init();
    Journal.init();
    Planner.init();
    Targets.init();
    Library.init();
    Study.init();
    Progress.init();
    Assistant.init();
    Notepad.init();
    UnrecordedStudy.init();
    Gamification.init();
    Settings.init();
  </script>

</body>
</html>
