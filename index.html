<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Journal + Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="main-nav">
    <button class="nav-btn" data-screen="calendar">Calendar</button>
    <button class="nav-btn" data-screen="journal">Journal</button>
    <button class="nav-btn" data-screen="planner">Planner</button>
    <button class="nav-btn" data-screen="progress">Progress</button>
  </nav>

  <main>
    <section id="screen-calendar" class="screen">
      <div id="calendar-header">
        <button id="calendar-prev">&lt; prev</button>
        <span id="calendar-month-label"></span>
        <button id="calendar-next">next &gt;</button>
      </div>
      <div id="calendar-grid"></div>
      <div id="calendar-countdown"></div>
    </section>
    <section id="screen-journal" class="screen">Journal screen — Phase 3</section>
    <section id="screen-planner" class="screen">Planner screen — Phase 2</section>
    <section id="screen-progress" class="screen">Progress screen — Phase 8</section>
</main>

  <div id="modal-overlay">
    <div id="modal-content"></div>
  </div>

  <!-- Load order matters: storage -> state -> nav -->
  <script src="storage.js"></script>
  <script src="state.js"></script>
  <script src="nav.js"></script>
  <script src="datehub.js"></script>
  <script src="modal.js"></script>
  <script src="calendar.js"></script>
  <script>
    State.init();
    Nav.init();
    Modal.init();
    Calendar.init();
  </script>

</body>
</html>
